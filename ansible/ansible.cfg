[defaults]
inventory = ./inventory/hosts.yml
roles_path = ./roles
remote_user = osg
host_key_checking = False

[ssh_connection]
environment = {"LC_ALL": "C.UTF-8", "LANG": "C.UTF-8"}

[privilege_escalation]
become = true
become_method = sudo
become_user = root
become_ask_pass = false
become_timeout = 30
